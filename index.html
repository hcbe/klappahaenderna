<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeltrainer</title>
<style>
:root{
  --bg:#f5f3ef; --card:#ffffff; --text:#232323; --muted:#6b6b6b;
  --accent:#2f5d50; --border:#ddd8cf; --ok:#2f7d4a; --bad:#a23b3b;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:24px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:var(--muted);margin-bottom:20px}
.panel,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.panel{margin-bottom:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
select,input,button{font:inherit}
select,input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:white}
button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.primary{background:var(--accent);color:white}
.secondary{background:#ece8e0}
.good{background:#e7f3ea;color:var(--ok)}
.bad{background:#f8e7e7;color:var(--bad)}
.word{font-size:34px;font-weight:700;margin:10px 0 4px}
.prompt{font-size:18px;color:var(--muted);margin-bottom:14px}
.forms{border-top:1px solid var(--border);margin-top:14px;padding-top:14px;display:grid;gap:7px}
.formrow{display:flex;gap:10px;align-items:flex-start}
.formrow b{min-width:180px}
.answer{margin-top:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feedback{margin-top:12px;font-weight:600}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:14px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
@media(max-width:600px){
 .word{font-size:28px}
 .formrow{display:block}
 .formrow b{display:block;margin-bottom:2px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vokabeltrainer</h1>
  <div class="sub">Wörter, Formen und Wiederholung nach Fehlerhäufigkeit</div>

  <div class="panel">
    <div class="controls">
      <div>
        <label>Kategorie</label>
        <select id="category">
          <option value="all">Alle gemischt</option>
          <option value="noun">Nomen</option>
          <option value="verb">Verben</option>
          <option value="adjective">Adjektive</option>
          <option value="basic">Grundwörter</option>
        </select>
      </div>
      <div>
        <label>Abfragerichtung</label>
        <select id="direction">
          <option value="mixed">Gemischt</option>
          <option value="sv-de">Schwedisch → Deutsch</option>
          <option value="de-sv">Deutsch → Schwedisch</option>
          <option value="forms">Formen lernen</option>
        </select>
      </div>
      <div>
        <label>Antwortprüfung</label>
        <select id="strictness">
          <option value="normal">Normal</option>
          <option value="lenient">Kulant</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div id="typeLabel" class="small"></div>
    <div id="word" class="word">–</div>
    <div id="prompt" class="prompt"></div>

    <div id="visibleForms" class="forms hidden"></div>

    <div class="answer">
      <input id="answerInput" type="text" autocomplete="off" placeholder="Antwort eingeben …">
      <div class="actions">
        <button id="checkBtn" class="primary">Prüfen</button>
        <button id="showBtn" class="secondary">Lösung zeigen</button>
        <button id="skipBtn" class="secondary">Überspringen</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div id="solutionBox" class="forms hidden"></div>

    <div id="manualActions" class="actions hidden">
      <button id="manualRight" class="good">Als richtig werten</button>
      <button id="manualWrong" class="bad">Als falsch werten</button>
      <button id="nextBtn" class="primary">Nächste</button>
    </div>

    <div class="stats">
      <span>Richtig: <b id="rightCount">0</b></span>
      <span>Falsch: <b id="wrongCount">0</b></span>
      <span>Serie: <b id="streak">0</b></span>
    </div>
  </div>
</div>

<script>
const vocab = [
  // Nomen
  {id:"n1",type:"noun",de:"Haus",sv:"hus",gender:"ett",forms:["ett hus","huset","hus","husen"]},
  {id:"n2",type:"noun",de:"Auto",sv:"bil",gender:"en",forms:["en bil","bilen","bilar","bilarna"]},
  {id:"n3",type:"noun",de:"Mann",sv:"man",gender:"en",forms:["en man","mannen","män","männen"]},
  {id:"n4",type:"noun",de:"Frau",sv:"kvinna",gender:"en",forms:["en kvinna","kvinnan","kvinnor","kvinnorna"]},
  {id:"n5",type:"noun",de:"Kind",sv:"barn",gender:"ett",forms:["ett barn","barnet","barn","barnen"]},
  {id:"n6",type:"noun",de:"Freund",sv:"vän",gender:"en",forms:["en vän","vännen","vänner","vännerna"]},
  {id:"n7",type:"noun",de:"Familie",sv:"familj",gender:"en",forms:["en familj","familjen","familjer","familjerna"]},
  {id:"n8",type:"noun",de:"Buch",sv:"bok",gender:"en",forms:["en bok","boken","böcker","böckerna"]},
  {id:"n9",type:"noun",de:"Tisch",sv:"bord",gender:"ett",forms:["ett bord","bordet","bord","borden"]},
  {id:"n10",type:"noun",de:"Stuhl",sv:"stol",gender:"en",forms:["en stol","stolen","stolar","stolarna"]},
  {id:"n11",type:"noun",de:"Tür",sv:"dörr",gender:"en",forms:["en dörr","dörren","dörrar","dörrarna"]},
  {id:"n12",type:"noun",de:"Fenster",sv:"fönster",gender:"ett",forms:["ett fönster","fönstret","fönster","fönstren"]},
  {id:"n13",type:"noun",de:"Stadt",sv:"stad",gender:"en",forms:["en stad","staden","städer","städerna"]},
  {id:"n14",type:"noun",de:"Land",sv:"land",gender:"ett",forms:["ett land","landet","länder","länderna"]},
  {id:"n15",type:"noun",de:"Straße",sv:"gata",gender:"en",forms:["en gata","gatan","gator","gatorna"]},
  {id:"n16",type:"noun",de:"Bahnhof",sv:"station",gender:"en",forms:["en station","stationen","stationer","stationerna"]},
  {id:"n17",type:"noun",de:"Hotel",sv:"hotell",gender:"ett",forms:["ett hotell","hotellet","hotell","hotellen"]},
  {id:"n18",type:"noun",de:"Restaurant",sv:"restaurang",gender:"en",forms:["en restaurang","restaurangen","restauranger","restaurangerna"]},
  {id:"n19",type:"noun",de:"Schule",sv:"skola",gender:"en",forms:["en skola","skolan","skolor","skolorna"]},
  {id:"n20",type:"noun",de:"Arbeit",sv:"arbete",gender:"ett",forms:["ett arbete","arbetet","arbeten","arbetena"]},
  {id:"n21",type:"noun",de:"Tag",sv:"dag",gender:"en",forms:["en dag","dagen","dagar","dagarna"]},
  {id:"n22",type:"noun",de:"Woche",sv:"vecka",gender:"en",forms:["en vecka","veckan","veckor","veckorna"]},
  {id:"n23",type:"noun",de:"Monat",sv:"månad",gender:"en",forms:["en månad","månaden","månader","månaderna"]},
  {id:"n24",type:"noun",de:"Jahr",sv:"år",gender:"ett",forms:["ett år","året","år","åren"]},
  {id:"n25",type:"noun",de:"Zeit",sv:"tid",gender:"en",forms:["en tid","tiden","tider","tiderna"]},
  {id:"n26",type:"noun",de:"Morgen",sv:"morgon",gender:"en",forms:["en morgon","morgonen","morgnar","morgnarna"]},
  {id:"n27",type:"noun",de:"Abend",sv:"kväll",gender:"en",forms:["en kväll","kvällen","kvällar","kvällarna"]},
  {id:"n28",type:"noun",de:"Nacht",sv:"natt",gender:"en",forms:["en natt","natten","nätter","nätterna"]},
  {id:"n29",type:"noun",de:"Wasser",sv:"vatten",gender:"ett",forms:["ett vatten","vattnet","—","—"]},
  {id:"n30",type:"noun",de:"Kaffee",sv:"kaffe",gender:"ett",forms:["ett kaffe","kaffet","—","—"]},

  // Verben
  {id:"v1",type:"verb",de:"sein",sv:"vara",forms:["vara","är","var","varit"]},
  {id:"v2",type:"verb",de:"haben",sv:"ha",forms:["ha","har","hade","haft"]},
  {id:"v3",type:"verb",de:"gehen",sv:"gå",forms:["gå","går","gick","gått"]},
  {id:"v4",type:"verb",de:"kommen",sv:"komma",forms:["komma","kommer","kom","kommit"]},
  {id:"v5",type:"verb",de:"machen",sv:"göra",forms:["göra","gör","gjorde","gjort"]},
  {id:"v6",type:"verb",de:"sehen",sv:"se",forms:["se","ser","såg","sett"]},
  {id:"v7",type:"verb",de:"wissen",sv:"veta",forms:["veta","vet","visste","vetat"]},
  {id:"v8",type:"verb",de:"sagen",sv:"säga",forms:["säga","säger","sa/sade","sagt"]},
  {id:"v9",type:"verb",de:"sprechen",sv:"tala",forms:["tala","talar","talade","talat"]},
  {id:"v10",type:"verb",de:"verstehen",sv:"förstå",forms:["förstå","förstår","förstod","förstått"]},
  {id:"v11",type:"verb",de:"essen",sv:"äta",forms:["äta","äter","åt","ätit"]},
  {id:"v12",type:"verb",de:"trinken",sv:"dricka",forms:["dricka","dricker","drack","druckit"]},
  {id:"v13",type:"verb",de:"wohnen",sv:"bo",forms:["bo","bor","bodde","bott"]},
  {id:"v14",type:"verb",de:"arbeiten",sv:"arbeta",forms:["arbeta","arbetar","arbetade","arbetat"]},
  {id:"v15",type:"verb",de:"lesen",sv:"läsa",forms:["läsa","läser","läste","läst"]},
  {id:"v16",type:"verb",de:"schreiben",sv:"skriva",forms:["skriva","skriver","skrev","skrivit"]},
  {id:"v17",type:"verb",de:"kaufen",sv:"köpa",forms:["köpa","köper","köpte","köpt"]},
  {id:"v18",type:"verb",de:"bezahlen",sv:"betala",forms:["betala","betalar","betalade","betalat"]},
  {id:"v19",type:"verb",de:"helfen",sv:"hjälpa",forms:["hjälpa","hjälper","hjälpte","hjälpt"]},
  {id:"v20",type:"verb",de:"beginnen",sv:"börja",forms:["börja","börjar","började","börjat"]},
  {id:"v21",type:"verb",de:"schlafen",sv:"sova",forms:["sova","sover","sov","sovit"]},
  {id:"v22",type:"verb",de:"fahren",sv:"köra",forms:["köra","kör","körde","kört"]},
  {id:"v23",type:"verb",de:"reisen/fahren",sv:"åka",forms:["åka","åker","åkte","åkt"]},
  {id:"v24",type:"verb",de:"finden",sv:"hitta",forms:["hitta","hittar","hittade","hittat"]},
  {id:"v25",type:"verb",de:"suchen",sv:"leta",forms:["leta","letar","letade","letat"]},
  {id:"v26",type:"verb",de:"fragen",sv:"fråga",forms:["fråga","frågar","frågade","frågat"]},
  {id:"v27",type:"verb",de:"antworten",sv:"svara",forms:["svara","svarar","svarade","svarat"]},
  {id:"v28",type:"verb",de:"geben",sv:"ge",forms:["ge","ger","gav","gett"]},
  {id:"v29",type:"verb",de:"nehmen",sv:"ta",forms:["ta","tar","tog","tagit"]},
  {id:"v30",type:"verb",de:"lernen",sv:"lära sig",forms:["lära sig","lär sig","lärde sig","lärt sig"]},

  // Adjektive
  {id:"a1",type:"adjective",de:"groß",sv:"stor",forms:["stor","stort","stora","större","störst"]},
  {id:"a2",type:"adjective",de:"klein",sv:"liten",forms:["liten","litet","små","mindre","minst"]},
  {id:"a3",type:"adjective",de:"gut",sv:"bra",forms:["bra","bra","bra","bättre","bäst"]},
  {id:"a4",type:"adjective",de:"schlecht",sv:"dålig",forms:["dålig","dåligt","dåliga","sämre","sämst"]},
  {id:"a5",type:"adjective",de:"neu",sv:"ny",forms:["ny","nytt","nya","nyare","nyast"]},
  {id:"a6",type:"adjective",de:"alt",sv:"gammal",forms:["gammal","gammalt","gamla","äldre","äldst"]},
  {id:"a7",type:"adjective",de:"warm",sv:"varm",forms:["varm","varmt","varma","varmare","varmast"]},
  {id:"a8",type:"adjective",de:"kalt",sv:"kall",forms:["kall","kallt","kalla","kallare","kallast"]},
  {id:"a9",type:"adjective",de:"schön",sv:"vacker",forms:["vacker","vackert","vackra","vackrare","vackrast"]},
  {id:"a10",type:"adjective",de:"schnell",sv:"snabb",forms:["snabb","snabbt","snabba","snabbare","snabbast"]},
  {id:"a11",type:"adjective",de:"langsam",sv:"långsam",forms:["långsam","långsamt","långsamma","långsammare","långsammast"]},
  {id:"a12",type:"adjective",de:"leicht",sv:"lätt",forms:["lätt","lätt","lätta","lättare","lättast"]},
  {id:"a13",type:"adjective",de:"schwierig",sv:"svår",forms:["svår","svårt","svåra","svårare","svårast"]},
  {id:"a14",type:"adjective",de:"müde",sv:"trött",forms:["trött","trött","trötta","tröttare","tröttast"]},
  {id:"a15",type:"adjective",de:"glücklich",sv:"glad",forms:["glad","glatt","glada","gladare","gladast"]},

  // Grundwörter
  {id:"b1",type:"basic",de:"ich",sv:"jag"},
  {id:"b2",type:"basic",de:"du",sv:"du"},
  {id:"b3",type:"basic",de:"wir",sv:"vi"},
  {id:"b4",type:"basic",de:"sie (Plural)",sv:"de"},
  {id:"b5",type:"basic",de:"und",sv:"och"},
  {id:"b6",type:"basic",de:"oder",sv:"eller"},
  {id:"b7",type:"basic",de:"aber",sv:"men"},
  {id:"b8",type:"basic",de:"nicht",sv:"inte"},
  {id:"b9",type:"basic",de:"hier",sv:"här"},
  {id:"b10",type:"basic",de:"dort",sv:"där"},
  {id:"b11",type:"basic",de:"heute",sv:"idag"},
  {id:"b12",type:"basic",de:"morgen",sv:"imorgon"},
  {id:"b13",type:"basic",de:"gestern",sv:"igår"},
  {id:"b14",type:"basic",de:"immer",sv:"alltid"},
  {id:"b15",type:"basic",de:"manchmal",sv:"ibland"},
  {id:"b16",type:"basic",de:"nie",sv:"aldrig"},
  {id:"b17",type:"basic",de:"wer",sv:"vem"},
  {id:"b18",type:"basic",de:"was",sv:"vad"},
  {id:"b19",type:"basic",de:"wo",sv:"var"},
  {id:"b20",type:"basic",de:"wohin",sv:"vart"},
  {id:"b21",type:"basic",de:"wann",sv:"när"},
  {id:"b22",type:"basic",de:"warum",sv:"varför"},
  {id:"b23",type:"basic",de:"wie",sv:"hur"},
  {id:"b24",type:"basic",de:"mit",sv:"med"},
  {id:"b25",type:"basic",de:"ohne",sv:"utan"}
];

const formLabels = {
 noun:["Unbestimmter Singular","Bestimmter Singular","Unbestimmter Plural","Bestimmter Plural"],
 verb:["Infinitiv","Präsens","Präteritum","Supinum"],
 adjective:["Grundform","ett-Form","Plural","Komparativ","Superlativ"]
};

const state = JSON.parse(localStorage.getItem("svTrainerStateV3") || '{"right":0,"wrong":0,"streak":0,"weights":{}}');
let current=null, currentDirection=null, expected=null, formIndex=null, answered=false;

const $=id=>document.getElementById(id);
function save(){ localStorage.setItem("svTrainerStateV3",JSON.stringify(state)); updateStats(); }
function updateStats(){ $("rightCount").textContent=state.right; $("wrongCount").textContent=state.wrong; $("streak").textContent=state.streak; }

function norm(s){
  return (s||"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[.,!?;:]/g,"").replace(/\s+/g," ");
}
function acceptable(given, exp){
  let g=norm(given), e=norm(exp);
  if(g===e) return true;
  if($("strictness").value==="lenient"){
    if(e.includes("/") && e.split("/").some(x=>norm(x)===g)) return true;
    if(g.length>=4 && e.startsWith(g)) return true;
  }
  return false;
}
function pool(){
  const cat=$("category").value;
  return vocab.filter(v=>cat==="all" || v.type===cat);
}
function weightedChoice(items){
  let expanded=[];
  items.forEach(v=>{
    let w=Math.max(1, state.weights[v.id]||1);
    for(let i=0;i<w;i++) expanded.push(v);
  });
  return expanded[Math.floor(Math.random()*expanded.length)];
}
function pickDirection(v){
  let d=$("direction").value;
  if(d==="mixed") d=Math.random()<.5?"sv-de":"de-sv";
  if(d==="forms" && !v.forms) d="de-sv";
  return d;
}
function showForms(container, v, onlyAfter=false){
  container.innerHTML="";
  if(!v.forms) return;
  formLabels[v.type].forEach((lab,i)=>{
    const div=document.createElement("div");
    div.className="formrow";
    div.innerHTML=`<b>${lab}</b><span>${v.forms[i]}</span>`;
    container.appendChild(div);
  });
}
function newQuestion(){
  answered=false; formIndex=null;
  $("feedback").textContent="";
  $("solutionBox").classList.add("hidden");
  $("manualActions").classList.add("hidden");
  $("visibleForms").classList.add("hidden");
  $("answerInput").value="";
  current=weightedChoice(pool());
  currentDirection=pickDirection(current);

  const typeName={noun:"Nomen",verb:"Verb",adjective:"Adjektiv",basic:"Grundwort"}[current.type];
  $("typeLabel").textContent=typeName;

  if(currentDirection==="sv-de"){
    $("word").textContent=current.sv;
    $("prompt").textContent="Deutsche Übersetzung eingeben";
    expected=current.de;
    if(current.forms){
      showForms($("visibleForms"),current);
      $("visibleForms").classList.remove("hidden");
    }
  } else if(currentDirection==="de-sv"){
    $("word").textContent=current.de;
    $("prompt").textContent="Schwedisches Wort eingeben";
    expected=current.sv;
  } else {
    formIndex=Math.floor(Math.random()*current.forms.length);
    const labels=formLabels[current.type];
    $("word").textContent=current.sv;
    $("prompt").textContent=`Form eingeben: ${labels[formIndex]}`;
    expected=current.forms[formIndex];
  }
  $("answerInput").focus();
}
function renderSolution(){
  $("solutionBox").innerHTML="";
  const a=document.createElement("div");
  a.className="formrow";
  a.innerHTML=`<b>Deutsch</b><span>${current.de}</span>`;
  $("solutionBox").appendChild(a);
  const b=document.createElement("div");
  b.className="formrow";
  b.innerHTML=`<b>Schwedisch</b><span>${current.sv}</span>`;
  $("solutionBox").appendChild(b);
  if(current.gender){
    const g=document.createElement("div");
    g.className="formrow";
    g.innerHTML=`<b>Artikel</b><span>${current.gender}</span>`;
    $("solutionBox").appendChild(g);
  }
  if(current.forms){
    formLabels[current.type].forEach((lab,i)=>{
      const div=document.createElement("div");
      div.className="formrow";
      div.innerHTML=`<b>${lab}</b><span>${current.forms[i]}</span>`;
      $("solutionBox").appendChild(div);
    });
  }
  $("solutionBox").classList.remove("hidden");
}
function mark(ok){
  if(ok){
    state.right++; state.streak++;
    state.weights[current.id]=Math.max(1,(state.weights[current.id]||1)-1);
  } else {
    state.wrong++; state.streak=0;
    state.weights[current.id]=Math.min(8,(state.weights[current.id]||1)+2);
  }
  save();
}
function check(){
  if(answered) return;
  answered=true;
  const ok=acceptable($("answerInput").value, expected);
  $("feedback").textContent=ok ? "Richtig ✓" : `Nicht ganz – richtig ist: ${expected}`;
  $("feedback").style.color=ok?"var(--ok)":"var(--bad)";
  renderSolution();
  mark(ok);
  $("manualActions").classList.remove("hidden");
}
$("checkBtn").onclick=check;
$("showBtn").onclick=()=>{ if(!answered){answered=true; renderSolution(); $("feedback").textContent=`Lösung: ${expected}`; $("feedback").style.color="var(--muted)"; $("manualActions").classList.remove("hidden");}};
$("skipBtn").onclick=newQuestion;
$("nextBtn").onclick=newQuestion;
$("manualRight").onclick=()=>{ state.right++; state.streak++; save(); newQuestion(); };
$("manualWrong").onclick=()=>{ state.wrong++; state.streak=0; state.weights[current.id]=Math.min(8,(state.weights[current.id]||1)+2); save(); newQuestion(); };
$("answerInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ if(!answered) check(); else newQuestion(); }});
$("category").onchange=newQuestion;
$("direction").onchange=newQuestion;
updateStats();
newQuestion();
</script>
</body>
</html>
